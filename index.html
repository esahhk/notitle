    <meta name="theme-color" content="#111">

    <style>
        * {
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            margin: 0;
            background: #111;
            color: #d6d6d6;
            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                "Noto Sans SC",
                "Microsoft YaHei",
                sans-serif;
            line-height: 1.7;
        }

        header,
        section,
        footer {
            width: 100%;
            padding: 72px 24px;
            border-bottom: 1px solid #252525;
        }

        header > *,
        section > *,
        footer > * {
            width: 100%;
            max-width: 912px;
            margin-left: auto;
            margin-right: auto;
        }

        header {
            min-height: 70vh;
            display: flex;
            align-items: center;
        }

        .hero {
            width: 100%;
        }

        .hero h1 {
            margin: 0 0 18px;
            font-size: clamp(42px, 8vw, 78px);
            font-weight: 500;
            letter-spacing: -0.04em;
            line-height: 1.05;
        }

        .hero p {
            max-width: 620px;
            margin: 0;
            color: #888;
            font-size: 16px;
        }

        .hero a {
            display: inline-block;
            margin-top: 28px;
            color: #aaa;
            text-decoration: none;
            border-bottom: 1px solid #444;
            transition:
                color 0.2s ease,
                border-color 0.2s ease;
        }

        .hero a:hover {
            color: #fff;
            border-color: #aaa;
        }

        .section-title {
            margin: 0 0 32px;
            font-size: 14px;
            font-weight: 500;
            color: #777;
            letter-spacing: 0.12em;
            text-transform: uppercase;
        }

        .about {
            max-width: 720px;
        }

        .about p {
            margin: 0 0 18px;
            color: #aaa;
        }

        .about p:last-child {
            margin-bottom: 0;
        }

        .notes {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 16px;
        }

        .note {
            padding: 24px;
            border: 1px solid #292929;
            background: #151515;
        }

        .note h3 {
            margin: 0 0 10px;
            font-size: 17px;
            font-weight: 500;
            color: #ddd;
        }

        .note p {
            margin: 0;
            color: #777;
            font-size: 14px;
        }

        .words {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 16px;
        }

        .word {
            min-height: 140px;
            padding: 24px;
            border: 1px solid #292929;
            background: #151515;
        }

        .word h3 {
            margin: 0 0 12px;
            font-size: 18px;
            font-weight: 500;
        }

        .word p {
            margin: 0;
            color: #777;
            font-size: 14px;
        }

        .videos {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 20px;
        }

        .card {
            display: flex;
            flex-direction: column;
            min-height: 140px;
            overflow: hidden;
            border: 1px solid #292929;
            background: #151515;
        }

        .card iframe {
            display: block;
            width: 100%;
            aspect-ratio: 16 / 9;
            border: 0;
            background: #0b0b0b;
        }

        .card-content {
            padding: 18px 20px 20px;
        }

        .card-content h3 {
            margin: 0 0 5px;
            font-size: 16px;
            font-weight: 500;
            color: #ddd;
        }

        .card-content p {
            margin: 0;
            color: #777;
            font-size: 14px;
        }

        .other {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .other iframe {
            width: 100%;
            aspect-ratio: 16 / 9;
            border: 0;
            background: #0b0b0b;
        }

        footer {
            border-bottom: 0;
            padding-top: 48px;
            padding-bottom: 48px;
        }

        footer p {
            margin: 0;
            color: #555;
            font-size: 13px;
        }

        @media (max-width: 720px) {
            header,
            section,
            footer {
                padding: 52px 18px;
            }

            header {
                min-height: 60vh;
            }

            .hero h1 {
                font-size: clamp(38px, 13vw, 60px);
            }

            .notes,
            .words,
            .videos {
                grid-template-columns: 1fr;
            }

            .note,
            .word {
                padding: 20px;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            html {
                scroll-behavior: auto;
            }

            .hero a {
                transition: none;
            }
        }
    </style>
</head>
